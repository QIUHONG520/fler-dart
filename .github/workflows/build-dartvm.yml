name: Build dartvm (v4 — Static Capstone)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    # 回写 version.json / manifest.json 到 main 时不重新触发全量构建（paths 过滤对 tag 推送不生效）
    paths-ignore:
      - 'version.json'
      - 'manifest.json'
      - 'dist/**'
  workflow_dispatch:
    inputs:
      dart-versions:
        description: '逗号分隔的 Dart 版本，如 3.12.2,3.10.0,2.18.6（留空 = 全部 32 个版本）'
        required: false
        default: ''
        type: string
      ndk-version:
        description: 'Android NDK version'
        required: false
        default: 'r27'
        type: string

env:
  NDK_VERSION: ${{ inputs.ndk-version || 'r27' }}
  DART_VERSIONS: '2.14.0 2.14.1 2.14.2 2.14.3 2.14.4 2.15.0 2.15.1 2.16.0 2.16.1 2.16.2 2.17.0 2.17.1 2.17.3 2.17.5 2.17.6 2.17.7 2.18.0 2.18.1 2.18.2 2.18.3 2.18.4 2.18.5 2.18.6 2.18.7 2.19.0 2.19.1 2.19.2 2.19.3 2.19.4 2.19.5 2.19.6 3.0.0 3.0.1 3.0.2 3.0.3 3.0.4 3.0.5 3.0.6 3.0.7 3.1.0 3.1.1 3.1.2 3.1.3 3.1.4 3.1.5 3.2.0 3.2.1 3.2.2 3.2.3 3.2.4 3.2.5 3.2.6 3.3.0 3.3.1 3.3.2 3.3.3 3.3.4 3.4.0 3.4.1 3.4.2 3.4.3 3.4.4 3.5.0 3.5.1 3.5.2 3.5.3 3.5.4 3.6.0 3.6.1 3.6.2 3.7.0 3.7.1 3.7.2 3.7.3 3.8.0 3.8.1 3.8.2 3.8.3 3.9.0 3.9.1 3.9.2 3.9.3 3.9.4 3.10.0 3.10.1 3.10.2 3.10.3 3.10.4 3.10.5 3.10.6 3.10.7 3.10.8 3.10.9 3.11.0 3.11.1 3.11.2 3.11.3 3.11.4 3.11.5 3.11.6 3.12.0 3.12.1 3.12.2 3.13.0 3.13.1'
  # releaseNotes：发版前更新为本次新增版本 + 更新内容
  # 说明：版本唯一数据源是 DART_VERSIONS（resolve-versions job 展开为 matrix）；
  # manifest.json 由打包阶段按实际构建产物自动枚举生成，发版新增/调整版本时只改 DART_VERSIONS。
  RELEASE_NOTES: 'v0.5.0：官方全版本（2.14~3.13）——自动拉取 dart-archive stable 列表，构建 2.14.0 至 3.13.1 共 105 个版本，后续新版本发布自动纳入。'

jobs:
  # ══════════════════════════════════════════════════════════
  # STAGE 0: Resolve target versions (push/tag = all; manual = comma list)
  # ══════════════════════════════════════════════════════════
  resolve-versions:
    name: Resolve Dart versions (official ∩ supported)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # 从 dart-archive (Google Cloud Storage) 拉取官方 stable 版本目录列表。
      # GCS JSON API 公开可访问，无需鉴权；返回的 prefixes 即每个 release 版本目录。
      - name: Fetch official stable versions (dart-archive)
        id: official
        run: |
          python3 <<'PYEOF'
          import json, urllib.request
          url = ("https://storage.googleapis.com/storage/v1/b/dart-archive/o"
                 "?prefix=channels/stable/release/&delimiter=/&maxResults=2000")
          try:
              data = json.loads(urllib.request.urlopen(url, timeout=60).read().decode("utf-8"))
              vers = []
              for p in data.get("prefixes", []):
                  name = p.rstrip("/").split("/")[-1]
                  # 只保留语义化版本 x.y[.z]（排除 1.0 前的 commit 号目录如 29803/、latest/）
                  if name and name[0].isdigit() and name.count(".") >= 1 and "-" not in name:
                      vers.append(name)
              with open("/tmp/official_versions.txt", "w") as f:
                  f.write("\n".join(sorted(set(vers))) + "\n")
              print("OK: official stable versions =", len(vers))
          except Exception as e:
              print("WARN: GCS fetch failed (%s), fallback to DART_VERSIONS" % e)
              with open("/tmp/official_versions.txt", "w") as f:
                  f.write("")  # 空 → 后续 step 用 env.DART_VERSIONS 兜底
          PYEOF

      - name: Resolve target matrix
        id: set-matrix
        run: |
          # 支持范围：2.14+ 与 3.x（用户要求；2.14/2.15 需 NO_INIT_LATE_STATIC_FIELD 宏，脚本已适配）
          if [ -s /tmp/official_versions.txt ]; then
            awk -F. '($1==2 && $2>=14) || $1==3' /tmp/official_versions.txt | sort -u > /tmp/supported.txt
          else
            # GCS 不可用 → 用 env.DART_VERSIONS 静态列表
            echo '${{ env.DART_VERSIONS }}' | tr ' ' '\n' | grep -v '^$' > /tmp/supported.txt
          fi

          if [ -z "${{ inputs.dart-versions }}" ]; then
            # 全量：官方存在 ∩ 支持范围（未来 3.14 等发布后自动纳入，无需改代码）
            cp /tmp/supported.txt /tmp/target.txt
            # 自动排除失败名单（dist 分支 dist/failed-versions.txt；首次构建文件不存在则跳过）
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/dist/dist/failed-versions.txt" \
              -o /tmp/failed.txt 2>/dev/null || true
            if [ -s /tmp/failed.txt ]; then
              before=$(wc -l < /tmp/target.txt)
              grep -v -F -x -f /tmp/failed.txt /tmp/target.txt > /tmp/target2.txt && mv /tmp/target2.txt /tmp/target.txt
              after=$(wc -l < /tmp/target.txt)
              echo "排除失败名单: $((before - after)) 个版本 -> $(tr '\n' ' ' < /tmp/failed.txt)"
            fi
          else
            # 手动指定：逗号分隔 → 与支持范围求交（剔除不存在的版本号）
            echo '${{ inputs.dart-versions }}' | tr ',' '\n'               | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > /tmp/target.txt
            comm -12 <(sort /tmp/target.txt) <(sort /tmp/supported.txt) > /tmp/target2.txt
            mv /tmp/target2.txt /tmp/target.txt
          fi

          if [ ! -s /tmp/target.txt ]; then
            echo "ERROR: no valid versions resolved (check inputs)" >&2
            exit 1
          fi
          csv=$(sed 's/^/"/;s/$/"/' /tmp/target.txt | paste -sd,)
          MATRIX="{\"dart-version\":[$csv]}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved versions: $(wc -l < /tmp/target.txt)"
          cat /tmp/target.txt

  # ══════════════════════════════════════════════════════════
  # STAGE 1: Build shared libraries (once, reused across versions)
  # ══════════════════════════════════════════════════════════
  shared-libs:
    name: Build Shared Libraries (capstone.a + ICU + c++_shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fler-dart
        uses: actions/checkout@v4
        with:
          path: fler-dart

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            curl git file p7zip-full patchelf

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache shared libs build (Capstone + ICU sources and builds)
        id: cache-shared-libs-build
        uses: actions/cache@v4
        with:
          path: |
            /tmp/fler-dart-cache/shared_libs/capstone-src
            /tmp/fler-dart-cache/shared_libs/capstone_build
            /tmp/fler-dart-cache/shared_libs/icu-src
            /tmp/fler-dart-cache/shared_libs/icu-host-build
            /tmp/fler-dart-cache/shared_libs/icu-cross-build
          key: shared-libs-${{ env.NDK_VERSION }}-icu73-2-capstone5-0-9-static-v2

      - name: Build shared libraries
        run: |
          bash fler-dart/scripts/build-dartvm.sh \
            --build-shared-libs-only \
            --ndk-path $ANDROID_NDK_HOME \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/fler-dart-cache/shared_libs"

      - name: Verify shared libs
        run: |
          echo "=== Shared libraries ==="
          ls -lh output/shared_libs/
          echo ""
          for f in output/shared_libs/libcapstone.*; do
            [ -f "$f" ] && file "$f"
          done
          echo ""
          for f in output/shared_libs/*.so; do
            [ -f "$f" ] && file "$f"
          done

      - name: Upload shared libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared_libs
          path: |
            output/shared_libs/*.so
            output/shared_libs/*.a
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 2: Build version-specific engines (matrix, parallel)
  # ══════════════════════════════════════════════════════════
  build-engines:
    name: Build Engine ${{ matrix.dart-version }}
    needs: [resolve-versions, shared-libs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 动态 matrix：由 resolve-versions 输出（手动输入逗号列表，或默认全量 DART_VERSIONS）
      matrix: ${{ fromJSON(needs.resolve-versions.outputs.matrix) }}

    steps:
      - name: Checkout fler-dart
        uses: actions/checkout@v4
        with:
          path: fler-dart

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            curl git file libicu-dev

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Download shared libs
        uses: actions/download-artifact@v4
        with:
          name: shared_libs
          path: output/shared_libs

      - name: Cache Blutter + build artifacts
        id: cache-dartvm
        uses: actions/cache@v4
        with:
          path: |
            /tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}/blutter
            /tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}/blutter/packages
          key: dartvm-${{ matrix.dart-version }}-${{ env.NDK_VERSION }}-v16-static-capstone
          restore-keys: |
            dartvm-${{ matrix.dart-version }}-${{ env.NDK_VERSION }}-v14

      - name: Patch blutter_entry.cpp (TMPDIR support)
        run: bash fler-dart/scripts/patch-tmpdir.sh

      - name: Build dartvm.so (static capstone)
        run: |
          mkdir -p output
          bash fler-dart/scripts/build-dartvm.sh \
            --dart-version ${{ matrix.dart-version }} \
            --ndk-path $ANDROID_NDK_HOME \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}" \
            --prebuilt-shared-libs-dir "$(pwd)/output/shared_libs"

      - name: Verify output
        run: |
          echo "=== Engine .so files for ${{ matrix.dart-version }} ==="
          ls -lh output/
          echo ""
          for f in output/dartvm_*.so; do
            [ -f "$f" ] && file "$f"
          done

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine_${{ matrix.dart-version }}
          path: output/dartvm_${{ matrix.dart-version }}_*.so
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 3: Package runtime libs + per-version engines into separate 7z
  # ══════════════════════════════════════════════════════════
  package-release:
    name: Package 7z Release (runtime libs + per-version)
    needs: [shared-libs, build-engines]
    if: always() && needs.shared-libs.result == 'success' && (needs.build-engines.result == 'success' || needs.build-engines.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Download shared libs
        uses: actions/download-artifact@v4
        with:
          name: shared_libs
          path: staging/shared_libs

      - name: Download all engine artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging/engines

      - name: Assemble runtime libs archive (mandatory)
        run: |
          mkdir -p release/runtime/lib
          echo "=== Runtime libs (mandatory: libc++_shared.so) ==="
          # ICU 不随包：dartvm.so 在构建期已跳过 ICU 链接（CMake 仅当 ICU 库存在才 link，
          # 见 dartvm/CMakeLists.txt），readelf 无 NEEDED libicuuc/libicudata。
          # 若未来某版本出现 ICU NEEDED，需回归本包。
          cp staging/shared_libs/libc++_shared.so release/runtime/lib/
          ls -lh release/runtime/lib/

      - name: Assemble per-version engine archives
        run: |
          mkdir -p release/engines
          echo "=== DartVM engines (per-version archives) ==="
          for dir in staging/engines/engine_*/; do
            [ -d "$dir" ] || continue
            for so in "$dir"*.so; do
              [ -f "$so" ] || continue
              ver=$(echo "$so" | grep -oP 'dartvm_\K[0-9.]+')
              mkdir -p "release/engines/dartvm-${ver}"
              cp "$so" "release/engines/dartvm-${ver}/dartvm_${ver}.so"
              echo "  Staged: dartvm_${ver}.so ($(ls -lh "$so" | awk '{print $5}'))"
            done
          done

      - name: Create 7z archives
        run: |
          # 7-Zip 23.00+ 会自动为 ARM64 ELF 可执行文件加 ARM64 BCJ filter
          # （方法 ID 0x0A），commons-compress 不支持该 filter（会报
          # "Unsupported compression method [10]"），故一律 -mf=off 禁用过滤器，
          # 确保纯 LZMA2（与旧整包一致）。
          # 运行库包：内含 lib/libc++_shared.so（解压到 engines/ 后落 engines/lib/）
          cd release/runtime
          7z a -mx=9 -m0=lzma2 -mf=off ../fler-runtime-libs.7z lib/
          cd ../..
          # 每版本包：内含 dartvm_<v>.so（解压到 engines/ 后落 engines/dartvm_<v>.so，
          # 增量共存，不覆盖其它已装版本）。归档统一放 release/ 根，便于 Release 上传。
          for dir in release/engines/dartvm-*/; do
            [ -d "$dir" ] || continue
            ver=$(basename "$dir")
            cd "$dir"
            7z a -mx=9 -m0=lzma2 -mf=off "../../${ver}.7z" dartvm_*.so
            cd ../../..
          done
          echo ""
          echo "=== 7z archives ==="
          ls -lh release/*.7z
          echo ""
          echo "=== Runtime libs archive listing ==="
          7z l release/fler-runtime-libs.7z

      - name: Verify archives are commons-compress decodable
        run: |
          set -e
          echo "=== Method per file (must NOT contain ARM64/BCJ/BCJ2) ==="
          for f in release/*.7z; do
            if 7z l -slt "$f" | grep -E "Method = .*(ARM64|BCJ|BCJ2)" ; then
              echo "ERROR: $f contains unsupported filters (ARM64/BCJ/BCJ2)"
              exit 1
            fi
            echo "OK (no filters): $f"
          done
          echo ""
          echo "=== Integrity test ==="
          for f in release/*.7z; do
            7z t "$f" > /dev/null
            echo "OK (test): $f"
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.7z > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload 7z package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fler-engines-release
          path: |
            release/fler-runtime-libs.7z
            release/dartvm-*.7z
            release/checksums.txt
          retention-days: 90

  # ══════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════
  # STAGE 4: Archive 7z to repo (dist branch) + publish manifest.json
  #   - 产物 7z 归档到独立 dist 分支（force push 只保留最新快照，仓库不膨胀）
  #   - manifest.json / version.json 发布到 main（App 端读取入口）
  #   - URL 策略：tag 触发 → GitHub Releases 下载；手动触发 → jsdelivr CDN (@dist)
  # ══════════════════════════════════════════════════════════
  archive-and-manifest:
    name: Archive to repo + Publish manifest.json
    needs: [shared-libs, build-engines, package-release]
    if: always() && needs.shared-libs.result == 'success' && (needs.build-engines.result == 'success' || needs.build-engines.result == 'failure') && needs.package-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (for manifest context)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download 7z package
        uses: actions/download-artifact@v4
        with:
          name: fler-engines-release
          path: release-assets

      # ── 归档到独立 dist 分支（孤儿分支：每次重建快照，历史只有最新产物，仓库不膨胀）──
      - name: Switch to orphan dist branch
        run: |
          git checkout --orphan dist
          git rm -rf . >/dev/null 2>&1 || true

      - name: Stage archives into dist/
        run: |
          rm -rf dist
          mkdir -p dist/engines dist/runtime
          cp release-assets/dartvm-*.7z dist/engines/ 2>/dev/null || true
          cp release-assets/fler-runtime-libs.7z dist/runtime/ 2>/dev/null || true
          cp release-assets/checksums.txt dist/ 2>/dev/null || true
          echo "=== dist/ ==="
          find dist -type f | sort
          echo "引擎包数量: $(ls dist/engines/*.7z 2>/dev/null | wc -l)"

      - name: Record failed versions to dist/failed-versions.txt
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const fs = require('fs');
            const path = 'dist/failed-versions.txt';

            // 1) 查询本次 run 的所有 job（分页，build-engines 可能 100+ 个）
            const failed = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id, per_page: 100, page,
              });
              for (const j of data.jobs) {
                // 只统计真正尝试过且失败的 Build Engine 版本（skipped 不算）
                if (j.name.startsWith('Build Engine ') &&
                    (j.conclusion === 'failure' || j.conclusion === 'cancelled')) {
                  const v = j.name.replace('Build Engine ', '').trim();
                  if (v) failed.push(v);
                }
              }
              if (data.jobs.length === 0 || data.jobs.length < 100 || page * 100 >= data.total_count) break;
              page++;
            }

            // 2) 读取 dist 分支旧名单，合并去重
            let existing = [];
            try {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'dist' });
              existing = Buffer.from(r.data.content, 'base64').toString('utf-8')
                .split('\n').map(s => s.trim()).filter(Boolean);
            } catch (_) {}

            const merged = [...new Set([...existing, ...failed])].sort();
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync(path, merged.length ? merged.join('\n') + '\n' : '');
            console.log('failed versions total (' + merged.length + '): ' + merged.join(', '));
            console.log('new this run: ' + failed.join(', '));

      - name: Commit and force-push dist branch (latest snapshot only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore(engines): archive $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes to commit"
          git push --force origin dist

      # ── 生成 manifest.json + version.json ──
      - name: Generate manifest.json + version.json
        run: |
          cd release-assets
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          else
            # 手动触发：产物已归档到 dist 分支的 dist/ 目录，走 raw.githubusercontent.com
            # （jsdelivr 对 force-push 的孤儿分支解析不稳定，会 404）
            TAG="latest"
            BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/dist/dist"
          fi
          RELEASE_NOTES='${{ env.RELEASE_NOTES }}'
          RT_SHA=$(sha256sum fler-runtime-libs.7z | awk '{print $1}')
          RT_SIZE=$(wc -c < fler-runtime-libs.7z)

          ENGINES_JSON=""
          DART_LIST=""
          for f in dartvm-*.7z; do
            [ -f "$f" ] || continue
            ver=$(echo "$f" | sed -E 's/^dartvm-([0-9.]+)\.7z$/\1/')
            sha=$(sha256sum "$f" | awk '{print $1}')
            size=$(wc -c < "$f")
            [ -n "$ENGINES_JSON" ] && ENGINES_JSON="$ENGINES_JSON,"
            ENGINES_JSON="$ENGINES_JSON { \"dartVersion\": \"$ver\", \"file\": \"$f\", \"url\": \"$BASE/$ENG_PATH$f\", \"sha256\": \"$sha\", \"sizeBytes\": $size }"
            DART_LIST="$DART_LIST \"$ver\","
          done
          DART_LIST=$(echo "$DART_LIST" | sed 's/,$//')

          cat > ../manifest.json <<EOF
          {
            "packVersion": "$TAG",
            "releaseNotes": "$RELEASE_NOTES",
            "runtimeLibs": {
              "file": "fler-runtime-libs.7z",
              "url": "$BASE/${RT_PATH}fler-runtime-libs.7z",
              "sha256": "$RT_SHA",
              "sizeBytes": $RT_SIZE
            },
            "engines": [$ENGINES_JSON]
          }
          EOF

          # 产物子目录：tag 模式文件在 release 根目录；非 tag 模式在 dist 分支 dist/engines、dist/runtime
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ENG_PATH=""
            RT_PATH=""
          else
            ENG_PATH="engines/"
            RT_PATH="runtime/"
          fi

          # manifest.json / version.json 在 main 分支；产物在 dist 分支（非 tag 时）
          MAIN_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/main"
          cat > ../version.json <<EOF
          {
            "version": "$TAG",
            "dartVersions": [$DART_LIST],
            "sizeBytes": $RT_SIZE,
            "releaseNotes": "$RELEASE_NOTES",
            "downloadUrl": "$MAIN_BASE/manifest.json",
            "checksumUrl": "$BASE/checksums.txt"
          }
          EOF
          echo "=== manifest.json ==="
          cat ../manifest.json

      - name: Commit manifest.json + version.json to main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = context.ref.split('/').pop();
            for (const path of ['manifest.json', 'version.json']) {
              const content = fs.readFileSync(path, 'utf8');
              let sha = null;
              try {
                sha = (await github.rest.repos.getContent({ owner, repo, path, ref: 'main' })).data.sha;
              } catch (_) {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                branch: 'main',
                content: Buffer.from(content).toString('base64'),
                message: 'chore: publish ' + path + ' for ' + tag,
                sha: sha || undefined,
              });
            }

  # STAGE 5: Create GitHub Release (tag pushes only)
  # ══════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs: [shared-libs, build-engines, package-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download 7z package
        uses: actions/download-artifact@v4
        with:
          name: fler-engines-release
          path: release-assets

      - name: Generate release summary
        run: |
          cd release-assets
          echo "Release assets:"
          ls -lh
          echo ""
          for f in *.7z; do
            echo "--- $f ---"
            7z l "$f" 2>/dev/null | tail -n +16 || true
          done
          echo "--- checksums.txt ---"
          cat checksums.txt 2>/dev/null || echo ""

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: fler-engines ${{ github.ref_name }} — Per-Version Engine Packages
          body: |
            ## fler-engines ${{ github.ref_name }} — Per-Version Engine Packages

            On-demand per-Dart-version engine packages + mandatory runtime libs.

            ### Package Contents
            - **Runtime libs (mandatory)**: `fler-runtime-libs.7z` → `lib/libc++_shared.so`
            - **Engines (per-version)**: `dartvm-<version>.7z`, each containing a single `dartvm_<version>.so` (32 versions)

            ### Architecture
            - **ABI**: arm64-v8a (Android ARM64)
            - **Static Capstone**: Capstone statically linked into each `dartvm_*.so`
            - **ICU**: not bundled (dartvm built without ICU dependency)
            - **rpath**: `$ORIGIN` for runtime shared lib resolution

            ### Usage (Fler App)
            The Fler app reads `manifest.json` (main branch) to list available remote Dart
            versions and downloads the chosen engine on demand. See `fler-engine-on-demand-download`.

            ### Installation Layout
            ```
            engines/
            ├── lib/libc++_shared.so          ← from fler-runtime-libs.7z
            └── dartvm_3.12.2.so             ← from dartvm-3.12.2.7z
            ```
          files: |
            release-assets/fler-runtime-libs.7z
            release-assets/dartvm-*.7z
            release-assets/checksums.txt
